services:
  neo4j:
    image: neo4j:5.26-community
    container_name: neo4j-demo
    restart: unless-stopped
    ports:
      - "7474:7474"  # Neo4j Browser (HTTP)
      - "7687:7687"  # Bolt (drivers, cypher-shell)
    environment:
      NEO4J_AUTH: neo4j/clase2026
      NEO4J_server_default__listen__address: 0.0.0.0
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./cypher:/cypher:ro
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p clase2026 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
